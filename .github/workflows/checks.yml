name: Tests and publication boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install optional MCP dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-mcp.txt
      - name: Unit tests including MCP stdio and RCON recovery
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Standard-library client tests
        run: python3 -m unittest discover -s tests -v
      - name: Scan tracked files and reachable history
        run: python3 scripts/check_publication.py --history
      - name: Scan secrets with pinned Gitleaks
        run: |
          mkdir -p .tools
          curl --fail --location --silent --show-error --retry 2 --max-time 60 -o .tools/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb .tools/gitleaks.tar.gz' | sha256sum --check --status
          tar -xzf .tools/gitleaks.tar.gz -C .tools gitleaks
          .tools/gitleaks git --redact --no-banner --log-opts=--all .
